name: CI/CD

on:
  push:
    branches:
      - '**' # Triggers on all branches

concurrency:
  group: ${{ github.ref }}
  # Never cancel main: interrupting a tofu apply can leave infra half-applied and the state locked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ENV: ${{ vars.ENV }}
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  # Runs on every branch, so it stays outside the prod environment (main and cicd* only) and gets
  # placeholders instead of its secrets: drizzle.config.ts only checks that these are set, and
  # nothing in build or test connects to the database.
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: |
          npm ci
          npm run build
          npm run test
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./packages/database/dist
      - name: Upload Lambda bundle
        uses: actions/upload-artifact@v4
        with:
          name: lambda-bundle
          path: ./backend/dist

  migrate:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only runs on the main branch
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Database Migration
        run: |
          npm ci
          npm run db:generate
          npm run db:migrate

  deploy-backend:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only runs on the main branch
    environment: prod
    permissions:
      contents: read
      id-token: write # OIDC token for assuming the AWS role
    env:
      TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Lambda bundle
        uses: actions/download-artifact@v4
        with:
          name: lambda-bundle
          path: ./backend/dist
      # Role is managed in infra/github-actions.tf and only trusts this repo's prod environment.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::590184139982:role/sheriff-sale-github-actions
          aws-region: us-east-2
      - name: Install OpenTofu (version from mise.toml)
        uses: jdx/mise-action@v5
      - name: OpenTofu Apply
        working-directory: ./infra
        run: |
          tofu init -input=false
          tofu apply -auto-approve -input=false

  deploy-frontend:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only runs on the main branch
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./packages/database/dist
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}