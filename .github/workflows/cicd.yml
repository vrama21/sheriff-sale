name: CI/CD

on:
  push:
    branches:
      - '**' # Triggers on all branches

concurrency:
  group: ${{ github.ref }}
  # Never cancel main: interrupting a tofu apply can leave infra half-applied and the state locked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

# Actions are pinned to the commit their release tag pointed at; the comment names the release.
jobs:
  # Runs on every branch, so it stays outside the prod environment and gets a placeholder instead of
  # its secret: drizzle.config.ts only checks that DATABASE_URL is set, drizzle-kit generate never
  # connects, and nothing in build or test connects to the database.
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Node
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node
      - name: Install dependencies
        run: npm ci
      # Migrations are generated by developers and committed; CI never generates them. A schema change
      # without its committed migration fails here. A rename drizzle-kit can't resolve makes it prompt,
      # which the timeout bounds; run `npm run db:generate` locally to answer it.
      - name: Check migrations match the schema
        timeout-minutes: 5
        run: |
          npm run db:generate --workspace=@sheriff-sale/database
          drift="$(git status --porcelain packages/database/drizzle)"
          if [ -n "$drift" ]; then
            echo "::error::The schema has changes with no committed migration. Run npm run db:generate and commit the result."
            echo "$drift"
            exit 1
          fi
      # Format check and lint (Oxfmt + Oxlint) against the root vite.config.ts.
      - name: Check
        run: npx vp check
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifacts
          path: ./packages/database/dist
      - name: Upload Lambda bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lambda-bundle
          path: ./backend/dist

  # Offline checks of infra/ on every branch: no backend, no AWS credentials, no environment.
  infra-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install OpenTofu (version from mise.toml)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: opentofu
      - name: Format check
        run: tofu fmt -check -recursive
      - name: Validate
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate

  # The prod jobs below are gated on main by `if:`, but that condition lives in this file, which any
  # pusher controls. The prod environment's deployment branch policy is the real boundary for its
  # secrets and the AWS role.
  migrate:
    needs: [build, infra-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only runs on the main branch
    environment: prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Node
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node
      # Applies the committed migrations only. They must be expand-only: they run before the deploys,
      # and nothing rolls them back if a deploy fails (see README "Deploying").
      - name: Database Migration
        run: |
          npm ci
          npm run db:migrate

  deploy-backend:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only runs on the main branch
    environment: prod
    permissions:
      contents: read
      id-token: write # OIDC token for assuming the AWS role
    env:
      TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download Lambda bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lambda-bundle
          path: ./backend/dist
      # Role is managed in infra/github-actions.tf and only trusts this repo's prod environment.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::590184139982:role/sheriff-sale-github-actions
          aws-region: us-east-2
      - name: Install OpenTofu (version from mise.toml)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: OpenTofu Apply
        working-directory: ./infra
        run: |
          tofu init -input=false -lockfile=readonly
          tofu apply -auto-approve -input=false

  deploy-frontend:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only runs on the main branch
    environment: prod
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} # Read by the Vercel CLI, so it never appears in argv.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Vercel project builds frontend/ with `next build`, which resolves @sheriff-sale/database
      # from its dist; nothing in vercel build builds the package.
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-artifacts
          path: ./packages/database/dist
      - name: Install Node
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node
      - name: Install Vercel CLI
        run: npm install --global vercel@64.5.0
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production
      - name: Build Project Artifacts
        run: vercel build --prod
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod
