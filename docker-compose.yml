# Local Postgres for development. Reads POSTGRES_* from the repo-root .env (copy .env.example).
# A fixed project name keeps one container and one volume across every checkout and worktree.
name: sheriff-sale

services:
  postgres:
    # Same major as prod (Railway). The 15.x image keeps PGDATA at /var/lib/postgresql/data.
    image: postgres:15
    container_name: sheriff-sale-postgres
    env_file:
      - .env
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
